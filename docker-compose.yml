services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: babel-gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=America/Los_Angeles
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
      # Lets the crawler reach Postgres on the Docker bridge without leaving
      # the tunnel. Without this the shared namespace cannot see the database.
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://www.erepublik.com"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  db:
    image: postgres:17
    container_name: babel-db
    environment:
      - POSTGRES_USER=babel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=babel
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Bound to loopback only: this is published purely so the operator can
    # run `psql` from the host. Nothing external needs it, and the compose
    # network already lets the crawler container reach `db` internally.
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babel"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    build: .
    container_name: babel-crawler
    env_file: .env
    volumes:
      - ${IMAGE_ROOT_HOST:-./data/images}:/data/images
      # So `babel probe --save-fixtures` writes onto the host, not into a
      # layer that vanishes with the container.
      - ./tests/fixtures:/app/tests/fixtures
    # No network stack of its own. If gluetun dies, this container has no
    # network — a leak is impossible rather than merely detected.
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
      db: {condition: service_healthy}
    restart: unless-stopped

  # The re-collection pass: the crawler's image and tunnel, but `--sweep-only`,
  # so it drains fetch_log's stale/error queue instead of walking.
  #
  # It is a service rather than the `compose run --rm` one-shot the docs used to
  # prescribe because that container carries `restart: no` and is deleted when it
  # exits. A host reboot therefore ended a 34-hour re-collection silently — every
  # other container came back healthy around it, `docker ps` looked right, and the
  # only symptom was `body_raw` quietly not filling.
  #
  # Behind a profile because it must NOT come up with a bare `docker compose
  # up -d`. RateLimiter is constructed per process (cli.py `_run`), so a sweep
  # running beside the walk asks eRepublik for two articles a second rather than
  # the one this project settled on. Stop `crawler` first, then:
  #
  #   docker compose --profile sweep up -d sweep     # start
  #   docker compose --profile sweep stop sweep      # when the queue drains
  #
  # `unless-stopped` then keeps it down across a reboot the same way it keeps a
  # hand-stopped `crawler` down, so stopping it once is enough.
  #
  # Like `crawler` and `images` this applies pending migrations at startup, so it
  # is subject to the same build-before-migrate rule in README.
  sweep:
    build: .
    container_name: babel-sweep
    command: ["babel", "run", "--no-poll", "--sweep-only"]
    profiles: ["sweep"]
    env_file: .env
    volumes:
      - ${IMAGE_ROOT_HOST:-./data/images}:/data/images
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
      db: {condition: service_healthy}
    restart: unless-stopped

  images:
    build: .
    container_name: babel-images
    command: ["babel", "images"]
    env_file: .env
    volumes:
      - ${IMAGE_ROOT_HOST:-./data/images}:/data/images
    # Same tunnel as the crawler. Image hosts are not eRepublik, but going
    # direct would expose the operator's address to save nothing.
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
      db: {condition: service_healthy}
    restart: unless-stopped

  web:
    build: .
    container_name: babel-web
    command: ["babel", "serve"]
    # Deliberately NOT env_file: .env, unlike every other service here. That
    # file carries WIREGUARD_PRIVATE_KEY, POSTGRES_PASSWORD, BOT_TOKEN and the
    # owner's DATABASE_URL, and `babel serve` reads none of them: Settings is
    # extra="ignore", and open_pool refuses to fall back to DATABASE_URL rather
    # than using it. This is the one process on the host that accepts inbound
    # connections from the internet, so it gets the four values it actually
    # uses and nothing else.
    #
    # One consequence, written down because it is not visible from the code:
    # open_pool's second refusal — WEB_DATABASE_URL must not EQUAL DATABASE_URL
    # — compares against Settings' placeholder default in this container, since
    # DATABASE_URL is no longer in its environment and .env is not in the image
    # (the Dockerfile copies pyproject.toml, uv.lock, src/ and migrations/ and
    # nothing else). It still fires where that mistake is actually made: `babel
    # serve` from a checkout, where pydantic-settings reads .env itself. Here
    # the controls are the role's own — SELECT-only grants and `ALTER ROLE
    # babel_web SET default_transaction_read_only = on`, both in .env.example —
    # which is what README already calls the actual enforcement.
    environment:
      - WEB_DATABASE_URL=${WEB_DATABASE_URL}
      - IMAGE_ROOT=${IMAGE_ROOT:-/data/images}
      - CONTACT=${CONTACT:-}
      - WEB_POOL_SIZE=${WEB_POOL_SIZE:-10}
    volumes:
      # Read-only: the site serves blobs, it never writes one.
      - ${IMAGE_ROOT_HOST:-./data/images}:/data/images:ro
    # Deliberately NOT network_mode: service:gluetun. That namespace cannot
    # accept inbound connections, and this service has no reason to egress:
    # its only outbound dependency is Postgres on the bridge. The site
    # therefore stays up when the tunnel is down.
    #
    # WEB_BIND must be the host's LAN address, matching the Cloudflare tunnel
    # ingress rule, and never 0.0.0.0 — Docker's published-port rules install
    # into the DOCKER chain and bypass the host firewall.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
