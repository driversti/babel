[project]
name = "babel"
version = "0.1.0"
description = "Archive of every eRepublik article and its comments"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "curl-cffi>=0.13.0",
    "aiohttp>=3.13.0",
    "selectolax>=0.3.21",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "click>=8.3.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
babel = "babel.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "testcontainers[postgres]>=4.14.0",
    "ruff>=0.15.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "jetson"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ASYNC", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# jetson/ runs on the L4T base image's Python 3.10, so ruff's pyupgrade rules —
# which target this repo's py312 — would suggest syntax that fails there.
"jetson/**" = ["UP"]
